name: Build Android APK and Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --ignore-scripts

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Android APK
        run: |
          set -o pipefail
          cd frontend/android
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../../gradle_build.log

      - name: Post Error to Commit
        if: failure()
        run: |
          MSG=$(tail -n 25 gradle_build.log | sed 's/"/\\"/g' | tr '\n' ' ')
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"Gradle Error:\n$MSG\"}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"

      - name: Prepare APK Output
        run: |
          mkdir -p output
          find frontend/android/app/build/outputs/apk -name "*.apk" -exec cp {} output/SmartMess.apk \;
          ls -lh output/SmartMess.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartMess-Android-APK
          path: output/SmartMess.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Build Windows Desktop App
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartMess-Windows-EXE
          path: frontend/dist_electron/*.exe
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: always() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Download Android Artifact
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: SmartMess-Android-APK
          path: release_files

      - name: Download Windows Artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: SmartMess-Windows-EXE
          path: release_files

      - name: Create GitHub Release with APK and EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Smart Mess Management System v1.0.0 (Release #${{ github.run_number }})
          body: |
            ### 📱 Smart Mess Management System - Official Downloads
            
            - **Android Mobile App:** Download and install `SmartMess.apk` on any Android device.
            - **Windows Desktop App:** Download and run `Smart Mess Management System Setup 1.0.0.exe` on Windows PC.
            - **Connected Database:** Neon PostgreSQL Cloud Database
            - **Live Web Portal:** [https://smartmess-system.vercel.app](https://smartmess-system.vercel.app)
            
            Developed by OH Tanvir © 2026
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
